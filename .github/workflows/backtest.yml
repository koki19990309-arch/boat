name: ◎の買い方の検証

on:
  workflow_dispatch:
    inputs:
      test_days:
        description: "検証する日数"
        default: "60"
      train_days:
        description: "学習に使う日数"
        default: "90"
      mode:
        description: "backtest(今の買い方) / blend(オッズと混ぜる) / search(買い方を探す) / experiment(ChatGPT案) / export(過去データ書き出し)"
        default: "backtest"

permissions:
  contents: write

concurrency:
  group: boatrace-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy scikit-learn requests
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: data-backtest
          restore-keys: data-
      - name: 検証する
        run: |
          if [ "${{ inputs.mode }}" = "blend" ]; then python blend.py; elif [ "${{ inputs.mode }}" = "search" ]; then python search.py; elif [ "${{ inputs.mode }}" = "experiment" ]; then python experiment.py; elif [ "${{ inputs.mode }}" = "export" ]; then python export.py; else python backtest.py "${{ inputs.test_days }}" "${{ inputs.train_days }}"; fi
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: cache
          key: data-backtest-${{ github.run_id }}
      - name: 過去データを export ブランチに置く
        if: inputs.mode == 'export'
        run: |
          git config user.name "boatrace-bot"
          git config user.email "boatrace-bot@users.noreply.github.com"
          cp export/boatrace_2026.zip /tmp/
          git checkout -q --orphan export
          git rm -rq --cached . && git clean -fdq -e cache
          cp /tmp/boatrace_2026.zip .
          git add boatrace_2026.zip
          git commit -q -m "過去データ(2026年1月〜)"
          git push -qf origin export
          git checkout -q main
      - name: 結果を保存
        if: inputs.mode != 'export'
        run: |
          git config user.name "boatrace-bot"
          git config user.email "boatrace-bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && exit 0
          git commit -q -m "◎の買い方の検証結果"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
